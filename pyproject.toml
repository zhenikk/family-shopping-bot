[project]
name = "family-shopping-bot"
dynamic = ["version"]
description = "A private, self-hosted Telegram shopping list for two people"
requires-python = ">=3.11"

[project.scripts]
shopping-bot = "shopping_bot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shopping_bot = ["*.json", "web/*.html", "web/*.css", "web/*.js", "web/help/*.png", "web/fonts/*.woff2", "web/fonts/*-OFL.txt"]

[tool.setuptools.dynamic]
version = {attr = "shopping_bot.__version__"}
