[project]
name = "family-shopping-bot"
version = "0.1.0"
description = "A private, self-hosted Telegram shopping list for two people"
requires-python = ">=3.11"

[project.scripts]
shopping-bot = "shopping_bot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
