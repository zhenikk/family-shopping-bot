services:
  bot:
    build:
      context: .
    env_file: .env
    environment:
      SHOPPING_WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
  tunnel:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [miniapp]
    command: tunnel --no-autoupdate --url http://bot:8080
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
