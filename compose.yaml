services:
  bot:
    build:
      context: .
    env_file: .env
    environment:
      SHOPPING_WEB_HOST: 0.0.0.0
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
    secrets:
      - deepseek_api_key
      - groq_api_key
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 45s
    init: true
    read_only: true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
  tunnel:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [miniapp]
    command: tunnel --no-autoupdate --url http://bot:8080
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_SECRET_FILE:-/dev/null}
  groq_api_key:
    file: ${GROQ_SECRET_FILE:-/dev/null}
