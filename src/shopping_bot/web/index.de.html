<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f1f2f6"><title>Einkäufe</title>
<link rel="preload" href="/fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
<header><h1><span id="title">Einkäufe</span> <span id="count" class="count" hidden></span></h1><div class="header-actions"><button id="family" class="chip" type="button">👥 Mitglieder</button><button id="refresh" class="icon-button" aria-label="Liste aktualisieren"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></svg></button></div></header>
<span id="connection" hidden>Offline</span>
<div id="demo-banner" hidden>Designvorschau, Demoprodukte</div>
<div class="toolbar"><label class="search"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></span><input id="search" type="search" placeholder="Produkt suchen" aria-label="Produkt suchen"></label><div id="filters" class="filters" aria-label="Kategorien"></div></div>
<main id="content" aria-live="polite"><div class="loading">Wird geladen…</div></main>
<nav aria-label="Hauptnavigation"><button data-tab="shopping" aria-current="page"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/></svg></span>Einkäufe</button><button data-tab="catalog"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>Katalog</button><button data-tab="history"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Verlauf</button><button data-tab="more"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>Mehr</button></nav>
</div>
<button class="fab" id="add" type="button" aria-label="Produkte hinzufügen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="product-dialog"><form id="product-form"><div class="sheet-top"><h2 id="product-name"></h2><button type="button" class="icon-button close" aria-label="Produktkarte schließen">×</button></div><div class="sheet-body"><p id="product-status" class="muted"></p><div id="product-photo"></div><label>Notiz<textarea id="note" maxlength="200" rows="2" placeholder="Zum Beispiel: bei Mercadona kaufen"></textarea></label><label>Kategorie<select id="category"></select></label><label class="secondary full photo-upload" id="photo-upload"><input id="photo-file" type="file" accept="image/*" capture="environment" hidden>📷 <span id="photo-label">Verpackungsfoto hinzufügen</span></label></div><div class="sheet-actions"><button type="button" id="product-action" class="primary full"></button><button type="submit" class="secondary full">Änderungen speichern</button></div></form></dialog>
<dialog id="add-dialog"><div class="sheet-top"><h2>Was brauchen wir?</h2><button type="button" class="icon-button close" aria-label="Hinzufügen schließen">×</button></div><div class="sheet-body"><form id="add-form"><label>Produkte<textarea id="items" rows="4" maxlength="2400" placeholder="Milch, Eier, Kartoffeln" required></textarea></label><p class="hint">Mit Komma getrennt oder eins pro Zeile. Eine Notiz folgt nach zwei Doppelpunkten: „Kartoffeln :: bei Mercadona kaufen“.</p><div id="draft" hidden></div></form></div><div class="sheet-actions"><button class="primary full" id="add-submit" type="submit" form="add-form">Liste prüfen</button><button type="button" class="text-button" id="voice">🎙 Per Sprache im Chat hinzufügen</button></div></dialog>
<div id="toast" role="status" hidden><span></span><button id="undo" hidden>Abbrechen</button></div>
<dialog id="help-dialog"><div class="sheet-top"><h2>So funktioniert’s</h2><button type="button" class="icon-button close" aria-label="Hilfe schließen">×</button></div><div class="sheet-body"><div class="roles"><button id="help-creator" class="chip selected" type="button"></button><button id="help-invited" class="chip" type="button"></button></div><div id="help-steps" aria-live="polite">Anleitung wird geladen…</div></div></dialog>
<dialog id="family-dialog"><div class="sheet-top"><h2>Mitglieder</h2><button type="button" class="icon-button close" aria-label="Mitgliederfenster schließen">×</button></div><div class="sheet-body"><div id="family-members" aria-live="polite"></div></div></dialog>
</body></html>
