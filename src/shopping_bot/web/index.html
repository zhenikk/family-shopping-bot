<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f1f2f6"><title>Покупки</title>
<link rel="preload" href="/fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
<header><h1><span id="title">Покупки</span> <span id="count" class="count" hidden></span></h1><div class="header-actions"><button id="family" class="chip" type="button">👥 Учасники</button><button id="refresh" class="icon-button" aria-label="Оновити список"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></svg></button></div></header>
<span id="connection" hidden>Немає зв’язку</span>
<div id="demo-banner" hidden>Перегляд дизайну, демонстраційні товари</div>
<div class="toolbar"><label class="search"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></span><input id="search" type="search" placeholder="Знайти товар" aria-label="Знайти товар"></label><div id="filters" class="filters" aria-label="Категорії"></div></div>
<main id="content" aria-live="polite"><div class="loading">Завантаження…</div></main>
<nav aria-label="Основна навігація"><button data-tab="shopping" aria-current="page"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/></svg></span>Покупки</button><button data-tab="catalog"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>Каталог</button><button data-tab="history"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Історія</button><button data-tab="more"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>Ще</button></nav>
</div>
<button class="fab" id="add" type="button" aria-label="Додати товари"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="product-dialog"><form id="product-form"><div class="sheet-top"><h2 id="product-name"></h2><button type="button" class="icon-button close" aria-label="Закрити картку">×</button></div><div class="sheet-body"><p id="product-status" class="muted"></p><div id="product-photo"></div><label>Нотатка<textarea id="note" maxlength="200" rows="2" placeholder="Наприклад: купити в Mercadona"></textarea></label><label>Категорія<select id="category"></select></label><label class="secondary full photo-upload" id="photo-upload"><input id="photo-file" type="file" accept="image/*" capture="environment" hidden>📷 <span id="photo-label">Додати фото упаковки</span></label></div><div class="sheet-actions"><button type="button" id="product-action" class="primary full"></button><button type="submit" class="secondary full">Зберегти зміни</button></div></form></dialog>
<dialog id="add-dialog"><div class="sheet-top"><h2>Що потрібно купити?</h2><button type="button" class="icon-button close" aria-label="Закрити додавання">×</button></div><div class="sheet-body"><form id="add-form"><label>Товари<textarea id="items" rows="4" maxlength="2400" placeholder="Молоко, яйця, картопля" required></textarea></label><p class="hint">Через кому або з нового рядка. Нотатка після двох двокрапок: «картопля :: купити в Mercadona».</p><div id="draft" hidden></div></form></div><div class="sheet-actions"><button class="primary full" id="add-submit" type="submit" form="add-form">Перевірити список</button><button type="button" class="text-button" id="voice">🎙 Додати голосом у чаті</button></div></dialog>
<div id="toast" role="status" hidden><span></span><button id="undo" hidden>Скасувати</button></div>
<dialog id="help-dialog"><div class="sheet-top"><h2>Як користуватися</h2><button type="button" class="icon-button close" aria-label="Закрити довідку">×</button></div><div class="sheet-body"><div class="roles"><button id="help-creator" class="chip selected" type="button"></button><button id="help-invited" class="chip" type="button"></button></div><div id="help-steps" aria-live="polite">Завантажуємо довідку…</div></div></dialog>
<dialog id="family-dialog"><div class="sheet-top"><h2>Учасники</h2><button type="button" class="icon-button close" aria-label="Закрити вікно учасників">×</button></div><div class="sheet-body"><div id="family-members" aria-live="polite"></div></div></dialog>
</body></html>
